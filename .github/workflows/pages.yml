name: Pages

# GitLab's `pages: true` job built YARD docs on every push to the default
# branch and GitLab Pages picked up the `public/` artifact automatically.
# GitHub Pages instead needs an explicit build (this job) plus a separate
# deploy job that calls actions/deploy-pages.
#
# NOT YET RUNNABLE AS-IS: this repo has never had GitHub Pages enabled
# (confirmed: has_pages: false, GET /repos/ScoreVision/pug-client-ruby/pages
# -> 404). actions/deploy-pages calls the Pages Deployments API, which
# requires a Pages site already provisioned with build_type=workflow; it does
# not create one. A repo admin has to do that once, out of band (Settings ->
# Pages -> Build and deployment -> Source: GitHub Actions), before the deploy
# job below will succeed. This workflow documents that requirement rather
# than provisioning it.
#
# GitLab's `pages` job was `stage: deploy`, which by default only starts
# once every stage: test job (i.e. `test`) has succeeded; `lint` has
# allow_failure: true so it never blocked that gate. Triggering on
# `workflow_run` of the CI workflow, rather than independently on `push`,
# reproduces that gate: build only runs once CI has completed for the same
# commit, and the conclusion check below reproduces the "must succeed" half.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

# Matches GitHub's own generated Pages-deploy template: one deployment at a
# time, queued rather than cancelled, so an in-flight deploy-pages call is
# never killed mid-upload and left in an inconsistent state.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    # Same rationale as ci.yml: a container image sidesteps the
    # allowed_actions: "selected" restriction that blocks ruby/setup-ruby.
    container:
      image: ruby:3.4.5
    steps:
      # workflow_run checks out the default branch by default, which would
      # silently build stale docs if main has moved since CI started. Pin to
      # the exact commit CI just tested.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/cache@v4
        with:
          path: vendor/bundle
          key: bundle-${{ hashFiles('Gemfile.lock') }}
          restore-keys: bundle-

      - name: bundle install
        run: |
          gem install bundler --no-document
          bundle config set --local path 'vendor/bundle'
          bundle install --jobs "$(nproc)"

      - name: Generate YARD docs
        run: bundle exec yard doc

      # No `mv doc public` step here: GitLab Pages hard-requires the artifact
      # directory to be named public/, but upload-pages-artifact accepts any
      # path, so doc/ (what .yardopts already writes) is uploaded directly.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: doc

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Job-level permissions replace the workflow-level block for this job
    # entirely. Scoped here rather than at the workflow level so `build`
    # -- which runs `bundle install` against a lockfile-resolved, untrusted
    # dependency tree -- never holds the ability to call the Pages
    # Deployments API or mint an OIDC token for this repo.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
